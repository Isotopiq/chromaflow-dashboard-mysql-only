# =====================================================================
# Easypanel-compatible Compose file for CHROMA.LAB.
# Self-contained: the app image bundles PostgreSQL + SSR in one container.
#
# Port (chosen to avoid conflicts with other Docker services):
#   - chroma-lab (frontend + backend SSR + bundled DB): host 29473 -> 29473
#
# The app is a single container running PostgreSQL + a Nitro SSR process
# that serves both the React frontend and /api/* backend on port 29473.
#
# Override any of these in Easypanel's Environment tab.
# =====================================================================

services:
  chroma-lab:
    # Pre-built image on Docker Hub — avoids slow on-server builds.
    # To build from source instead, replace the next two lines with:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile
    image: ddlidded/chroma-lab:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "29473:29473"
    volumes:
      # Bind mount to a host directory so data survives Easypanel redeploys.
      # Named Docker volumes can be recreated by Easypanel on each deploy;
      # a bind mount to a fixed host path is persistent.
      - /var/lib/chroma-lab:/app/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "29473"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "29473"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-all}

      # ---- Core app ----
      APP_URL: ${APP_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}

      # ---- First admin (created idempotently on startup) ----
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}

      # ---- Postgres (bundled inside the container) ----
      # The entrypoint script auto-initializes and starts a bundled
      # PostgreSQL on 127.0.0.1:5432. These creds are used by initdb
      # on first run and by the app to connect. Changing them after
      # the first run requires wiping the /app/data volume.
      POSTGRES_USER: ${POSTGRES_USER:-chroma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chroma}
      POSTGRES_DB: ${POSTGRES_DB:-chroma_lab}
      # DATABASE_URL is auto-set by the entrypoint to point at the
      # bundled postgres. Only set this if you want to use an
      # EXTERNAL database instead.
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      # ---- S3-compatible storage ----
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/data/uploads}

      # ---- SMTP ----
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:29473/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
