appId: com.isotopiq.v3-companion
productName: V3 Companion
directories:
  output: dist-installer
  buildResources: resources
files:
  - dist/renderer/**/*
  - dist/main/**/*
  - dist/preload/**/*
  - resources/**/*
  - package.json
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: ekapelczak
  repo: chromaflow-dashboard-mysql-only
