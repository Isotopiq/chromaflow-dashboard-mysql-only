appId: com.isotopiq.v3-companion
productName: V3 Companion
directories:
  output: dist-installer
  buildResources: resources
files:
  - dist/renderer/**/*
  - dist/main/**/*
  - dist/preload/**/*
  - dist/shared/**/*
  - resources/**/*
  - package.json
asar: false
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  signtoolOptions: null
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: "V3 Companion Portable ${version}.exe"
publish:
  provider: github
  owner: ekapelczak
  repo: chromaflow-dashboard-mysql-only
